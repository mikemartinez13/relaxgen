# relaxgen: EqV3 and MACE-ft pre-relaxation. After creating, from the repo root:
#   pip install --no-deps mace-torch==0.3.15 -e eqv3_fairchem
# (mace-torch 0.3.15 pins e3nn==0.4.4 but runs with the e3nn 0.6.0 EqV3 needs.)
# Versions are what this env's Python loaded on UVA Afton/Rivanna (2026-10-28),
# including packages it picked up from ~/.local.
